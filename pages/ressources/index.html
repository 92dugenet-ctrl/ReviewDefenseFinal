ge .meta{display:flex;justify-content:space-between;gap:6px;font-size:9px;color:#77766f;margin-bottom:13px}.resources-page .small-blog h2,.resources-page .bottom-card h2{font-size:13px}.resources-page .read{display:block;text-align:right;font-size:10px;color:#6c6b64;margin-top:10px}.resources-page .video-card{grid-column:span 1;display:flex;flex-direction:column;background:var(--tile-beige);color:var(--ink)}.resources-page .thumb{height:69%;position:relative;overflow:hidden;background:var(--tile-beige)}.resources-page .video-card img{width:100%;height:100%;object-fit:cover}.resources-page .video-card .play{width:33px;height:33px;font-size:13px}.resources-page .video-card .caption{padding:8px 11px}.resources-page .video-card .kind{margin-bottom:5px}.resources-page .video-card h2{font-size:12px;margin:0}.resources-page .bottom-card{grid-column:span 1;display:grid;grid-template-columns:1fr 45%}.resources-page .bottom-card .copy{padding:14px 12px}.resources-page .bottom-card .meta{gap:4px;margin-bottom:13px}.resources-page .bottom-card p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@media(max-width:700px){.resources-page .page{padding:24px 16px 0}.resources-page .mosaic{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:180px;gap:10px}.resources-page .feature{grid-column:span 2;grid-row:span 1}.resources-page .feature .visual{height:65%}.resources-page .small-blog,.resources-page .video-card,.resources-page .bottom-card{grid-column:span 1;grid-row:span 1}.resources-page .small-blog,.resources-page .bottom-card{grid-template-columns:1fr}.resources-page .small-blog img,.resources-page .bottom-card img{display:none}.resources-page .video-card .thumb{height:64%}.resources-page .tile h2{font-size:12px}.resources-page .feature h2{font-size:16px}}
